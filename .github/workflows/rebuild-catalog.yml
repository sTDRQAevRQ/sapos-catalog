name: Rebuild catalog from Shopify

on:
  workflow_dispatch:
    inputs:
      deploy_sites:
        description: "Run the Sites save-version + deploy job after the catalog rebuild"
        required: false
        default: true
        type: boolean
      deploy_without_data_change:
        description: "For manual validation, deploy to Sites even when catalog data did not change"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: sapos-catalog-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.changes.outputs.changed }}
    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Validate required Shopify secrets
        run: |
          test -n "$SHOPIFY_STORE"
          test -n "$SHOPIFY_ACCESS_TOKEN"

      - name: Rebuild catalog from Shopify
        run: python3 scripts/build_catalog_from_sheet.py

      - name: Build front
        run: npm run build

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- \
            data/catalog.json \
            public/data/catalog.json \
            data/brand-logos.json \
            public/data/brand-logos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if data changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add \
            data/catalog.json \
            public/data/catalog.json \
            data/brand-logos.json \
            public/data/brand-logos.json
          git commit -m "Auto: rebuild catalog from Shopify"
          git push

      - name: Package Sites archive
        run: tar -C dist -czf site-dist-auto.tar.gz .

      - name: Upload Sites archive
        uses: actions/upload-artifact@v4
        with:
          name: sites-dist
          path: site-dist-auto.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-sites:
    needs: rebuild
    if: github.event.inputs.deploy_sites != 'false' && (needs.rebuild.outputs.data_changed == 'true' || github.event.inputs.deploy_without_data_change == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Sites archive
        uses: actions/download-artifact@v4
        with:
          name: sites-dist
          path: .

      - name: Validate OpenAI deployment secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Run Codex Sites deployment
        id: codex_sites
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/deploy-sites.md
          output-file: codex-sites-output.md
          sandbox: danger-full-access
          safety-strategy: drop-sudo

      - name: Upload Codex deployment transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-sites-output
          path: codex-sites-output.md
          if-no-files-found: ignore
          retention-days: 7

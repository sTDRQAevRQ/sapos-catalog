name: Rebuild catalog from Shopify

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sapos-catalog-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || vars.CATALOG_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Validate required Shopify secrets
        run: |
          test -n "$SHOPIFY_STORE"
          test -n "$SHOPIFY_ACCESS_TOKEN"

      - name: Rebuild catalog from Shopify
        run: python3 scripts/build_catalog_from_sheet.py

      - name: Build front
        run: npm run build

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- \
            data/catalog.json \
            public/data/catalog.json \
            data/brand-logos.json \
            public/data/brand-logos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if data changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add \
            data/catalog.json \
            public/data/catalog.json \
            data/brand-logos.json \
            public/data/brand-logos.json
          git commit -m "Auto: rebuild catalog from Shopify"
          git push

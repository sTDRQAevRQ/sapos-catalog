name: Rebuild catalog from Google Sheet

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install gspread google-auth

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_SHEETS_CREDENTIALS_JSON }}' > scripts/google-credentials.json

      - name: Build catalog from Google Sheet
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python3 scripts/build_catalog_from_sheet.py

      - name: Remove credentials file
        if: always()
        run: rm -f scripts/google-credentials.json

      - name: Commit and push if the catalog changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/catalog.json public/data/catalog.json
          git diff --cached --quiet || git commit -m "Auto: rebuild catalog from Google Sheet"
          git push
